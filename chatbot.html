<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fake News Detector Bot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            height: 80vh;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
            border-bottom: 3px solid #5568d3;
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f8f9fa;
        }

        .message {
            margin-bottom: 15px;
            display: flex;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.bot {
            justify-content: flex-start;
        }

        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 12px;
            word-wrap: break-word;
        }

        .user .message-content {
            background: #667eea;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .bot .message-content {
            background: #e9ecef;
            color: #333;
            border-bottom-left-radius: 4px;
        }

        .result-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: bold;
            margin-top: 8px;
            font-size: 14px;
        }

        .result-badge.fake {
            background-color: #ff6b6b;
            color: white;
        }

        .result-badge.real {
            background-color: #51cf66;
            color: white;
        }

        .input-section {
            padding: 15px;
            background: white;
            border-top: 1px solid #dee2e6;
            display: flex;
            gap: 10px;
        }

        .input-group {
            flex: 1;
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #dee2e6;
            border-radius: 25px;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        button {
            padding: 12px 25px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: all 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .loading {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: #667eea;
            animation: blink 1.4s infinite;
        }

        @keyframes blink {
            0%, 80%, 100% { opacity: 0.2; }
            40% { opacity: 1; }
        }

        .info-box {
            background: #e7f3ff;
            border-left: 4px solid #667eea;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 5px;
            font-size: 12px;
            color: #0066cc;
        }

        .error-box {
            background: #ffe7e7;
            border-left: 4px solid #ff6b6b;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 5px;
            font-size: 12px;
            color: #cc0000;
        }

        .confidence {
            font-size: 12px;
            opacity: 0.8;
            margin-top: 6px;
        }

        @media (max-width: 600px) {
            .container {
                height: 90vh;
                border-radius: 0;
            }

            .header h1 {
                font-size: 20px;
            }

            .message-content {
                max-width: 85%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔍 Fake News Detector</h1>
            <p>Powered by Machine Learning</p>
        </div>

        <div class="chat-box" id="chatBox">
            <div class="message bot">
                <div class="message-content">
                    <div class="info-box">
                        👋 Hello! I'm a Fake News Detector bot. Paste any news article title or text, and I'll tell you if it's likely <strong>REAL</strong> or <strong>FAKE</strong>. 
                        <br><br>
                        Try it: "Scientists discover the moon is made of cheese"
                    </div>
                </div>
            </div>
        </div>

        <div class="input-section">
            <div class="input-group">
                <input 
                    type="text" 
                    id="userInput" 
                    placeholder="Paste news title or article text here..." 
                    autocomplete="off"
                >
                <button id="sendBtn">Send</button>
            </div>
        </div>
    </div>

    <script>
        const chatBox = document.getElementById('chatBox');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');

        // Change this to your backend URL
        // If using Render.com, it would be: https://your-app-name.onrender.com/predict
        // If using Replit, it would be: https://your-replit.replit.dev/predict
        const BACKEND_URL = 'https://your-backend-url/predict';

        // Add message to chat
        function addMessage(text, isUser = false, isError = false) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user' : 'bot'}`;

            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            contentDiv.innerHTML = text;

            messageDiv.appendChild(contentDiv);
            chatBox.appendChild(messageDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // Add loading indicator
        function addLoading() {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message bot';
            messageDiv.id = 'loadingMsg';

            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            contentDiv.innerHTML = '<div class="loading"></div> Analyzing...';

            messageDiv.appendChild(contentDiv);
            chatBox.appendChild(messageDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // Remove loading indicator
        function removeLoading() {
            const loadingMsg = document.getElementById('loadingMsg');
            if (loadingMsg) {
                loadingMsg.remove();
            }
        }

        // Send prediction request
        async function predictNews() {
            const text = userInput.value.trim();

            if (!text) {
                addMessage('<div class="error-box">⚠️ Please enter some text to analyze!</div>', false);
                return;
            }

            // Add user message
            addMessage(text, true);
            userInput.value = '';

            // Show loading
            addLoading();

            try {
                const response = await fetch(BACKEND_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ text: text })
                });

                removeLoading();

                if (!response.ok) {
                    throw new Error(`Server error: ${response.status}`);
                }

                const data = await response.json();
                const prediction = data.prediction; // 'REAL' or 'FAKE'
                const confidence = data.confidence; // 0-100

                let resultHTML = `
                    <strong>Analysis Result:</strong>
                    <div class="result-badge ${prediction.toLowerCase()}">
                        ${prediction === 'FAKE' ? '❌' : '✅'} ${prediction}
                    </div>
                    <div class="confidence">Confidence: ${confidence}%</div>
                `;

                addMessage(resultHTML, false);

            } catch (error) {
                removeLoading();
                console.error('Error:', error);
                addMessage(
                    `<div class="error-box">
                        ❌ <strong>Connection Error</strong><br>
                        ${error.message}<br><br>
                        Make sure your backend is running and the URL is correct.
                    </div>`,
                    false
                );
            }
        }

        // Event listeners
        sendBtn.addEventListener('click', predictNews);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                predictNews();
            }
        });

        // Focus input on load
        userInput.focus();
    </script>
</body>
</html>
